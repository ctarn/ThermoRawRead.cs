<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermoRawRead</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<header><h1>ThermoRawRead</h1></header>
<main>
    <div class="panel ctrl-panel">
        <section class="stack">
            <header class="section-head">
                <h3>Selected Inputs</h3>
                <small id="input-count">0 entry</small>
            </header>
            <ul class="path-list" id="input-list"></ul>
            <label class="toggle">
                <input id="input-is-recursive" type="checkbox"/>
                <span>discover `.raw` files inside subfolders</span>
            </label>
            <div class="button-row">
                <button id="input-add-file" class="primary-btn" type="button">Add File</button>
                <button id="input-add-folder" type="button">Add Folder</button>
                <button id="input-clear" type="button">Clear</button>
            </div>
        </section>

        <section class="stack">
            <h3>Output Directory</h3>
            <div class="input-row">
                <input id="output-path" placeholder="Optional. Defaults to each RAW file directory." type="text"/>
                <button id="output-pick" class="input-action" type="button">Browse</button>
            </div>
        </section>

        <section class="stack">
            <header class="section-head">
                <h3>Export Formats</h3>
                <small>Choose one or more</small>
            </header>
            <div class="option-grid" id="format-grid"></div>
        </section>

        <section class="button-row">
            <button class="primary-btn" id="start-job" type="button">Run</button>
            <button class="danger-btn" disabled id="stop-job" type="button">Stop</button>
        </section>

        <section class="stack status">
            <h3 class="badge badge-muted" id="status-badge">[status-badge]</h3>
            <small id="status-text">[status-text]</small>
        </section>

        <section class="stack">
            <h3>Command Preview</h3>
            <code class="mono-block" id="command-preview">ThermoRawRead ...</code>
        </section>
    </div>
    <div class="panel status-panel">
        <pre class="mono-block" id="log-output">idle...</pre>
        <button id="clear-log" type="button">Clear</button>
    </div>
</main>
<footer>
    <span><a href="http://ctarn.io">http://ctarn.io</a></span>
    <span>Copyright &copy; Tarn Yeong Ching</span>
    <span><a href="mailto:i@ctarn.io">i@ctarn.io</a></span>
</footer>

<script src="./renderer.js" type="module"></script>
</body>
</html>
