<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ThermoRawRead</title>
    <link href="./styles.css" rel="stylesheet"/>
</head>
<body>
<div class="shell">
    <header class="hero">
        <div><h1>ThermoRawRead</h1></div>
    </header>

    <main class="layout">
        <section class="panel panel-form">
            <div class="panel-head">
                <div>
                    <p class="eyebrow">Configuration</p>
                </div>
            </div>

            <div class="actions">
                <button class="primary-btn" id="pick-files" type="button">Select File</button>
                <button class="secondary-btn" id="pick-input-dir" type="button">Select Folder</button>
                <button class="secondary-btn" id="pick-output-dir" type="button">Select Output Folder</button>
                <button class="ghost-btn" id="clear-inputs" type="button">Clear</button>
            </div>

            <div class="stack">
                <div class="section-title">
                    <span>Selected Inputs</span>
                    <small id="input-count">0 entry</small>
                </div>
                <ul class="path-list" id="input-list"></ul>
            </div>

            <label class="field">
                <span>Output Directory</span>
                <input id="output-dir" placeholder="Optional. Defaults to each RAW file directory." type="text"/>
            </label>

            <label class="toggle">
                <input id="recursive" type="checkbox"/>
                <span>Recursively discover `.raw` files inside selected folders</span>
            </label>


            <div class="stack">
                <div class="section-title">
                    <span>Export Formats</span>
                    <small>Choose one or more</small>
                </div>
                <div class="format-grid" id="format-grid"></div>
            </div>

            <div class="command-preview">
                <span>Command Preview</span>
                <code id="command-preview">ThermoRawRead --umz --csv --txt --meth &lt;input&gt;</code>
            </div>

            <div class="runbar">
                <button class="primary-btn" id="run-job" type="button">Run</button>
                <button class="danger-btn" disabled id="stop-job" type="button">Stop</button>
            </div>
        </section>

        <section class="panel panel-log">
            <div class="panel-head">
                <div>
                    <p class="eyebrow">Status</p>
                </div>
                <button class="ghost-btn" id="clear-log" type="button">Clear</button>
            </div>
            <pre class="log-output" id="log-output">backend idle...</pre>
            <div class="status-card">
                <span class="badge badge-muted" id="backend-badge">Backend idle</span>
                <p id="status-text">Load RAW files or folders, then start a conversion run.</p>
            </div>
        </section>
    </main>
</div>

<script src="./app.js" type="module"></script>
</body>
</html>
